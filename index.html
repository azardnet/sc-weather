    <style>
      .portal-loading {
        position: fixed;
        left: 0;
        bottom: 0;
        top: 0;
        margin: auto;
        width: 100%;
        height: 100%;
        z-index: 1;
        background-color: rgba(0, 0, 0, 1);
        display: flex;
        transition-duration: 250ms;
        justify-content: center;
        align-items: center;
      }
      .portal-loading .logo {
        position: relative;
        width: 200px;
        height: 200px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 50%;

        align-items: center;
        justify-content: center;
      }
      .portal-loading .logo svg.azard {
        width: 80%;
        height: 80%;
      }
      .portal-loading .logo svg.azard path {
        fill: hsla(32, 100%, 40%, 1);
        animation-name: Logo;
        animation-iteration-count: infinite;
        animation-duration: 5000ms;
        transform: translate3d(0px, -50px, 0px);
      }
      @keyframes Logo {
        0% { fill: hsla(32, 100%, 40%, 1); }
        25% { fill: hsla(66, 100%, 40%, 1); }
        50% { fill: hsla(32, 100%, 40%, 1); }
        75% { fill: hsla(66, 100%, 40%, 1); }
        100% { fill: hsla(32, 100%, 40%, 1); }
      }
      .portal-loading .logo svg.circle {
        width: 100%;
        height: 100%;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        top: 0;
        margin: auto;
        transform-origin: center center;
        transform: rotate(90deg) scale(3);
      }
      .portal-loading .logo svg.circle path {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        stroke-width: 3px;
        stroke-linecap: round;

        stroke-dashoffset: 40px;
